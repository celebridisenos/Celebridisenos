<script>
  // Si el navegador es demasiado antiguo para la app, lo decimos claramente
  setTimeout(function () { if (!window.__appStarted && !document.querySelector('.shell,.auth-card,.wizard')) { var d = document.getElementById('app'); if (d && /Cargando/.test(d.textContent)) d.innerHTML = '<div class="center-page"><div class="card auth-card"><h2>No se pudo iniciar</h2><p>Actualiza el navegador (Chrome, Edge o Safari recientes) o recarga la página.</p><button class="btn primary" onclick="location.reload()">Recargar</button></div></div>'; } }, 15000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      window.__cdSW = reg; // v16.3.2: lo usa el botón fijo «Buscar actualización»
      // una versión que ya se bajó la última vez se aplica nada más abrir (todavía no hay nada a medio escribir)
      if (reg.waiting && navigator.serviceWorker.controller) reg.waiting.postMessage('skip');
      var busca = function () { try { reg.update(); } catch (e) { } };
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') busca(); });
      setInterval(busca, 30 * 60000);
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        w && w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            // v16.3.3: AUTOMÁTICO. Si no estás escribiendo ni tienes una ventana abierta, se aplica sola en 2 segundos.
            var a = document.activeElement, ocupado = (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) || document.querySelector('.modal, .drawer');
            if (!ocupado) { var av = document.createElement('div'); av.className = 'toast'; av.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:400'; av.textContent = '🔄 Actualizando la app…'; document.body.appendChild(av); setTimeout(function () { w.postMessage('skip'); }, 2000); return; }
            var b = document.createElement('div');
            b.className = 'toast'; b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:400';
            b.innerHTML = '<span>Hay una versión nueva de la app.</span> <button class="btn sm primary">Actualizar</button>';
            b.querySelector('button').onclick = function () { w.postMessage('skip'); };
            document.body.appendChild(b);
          }
        });
      });
    });
    var reloaded = false, hadController = !!navigator.serviceWorker.controller;
    // v10.6: la primera vez (sin versión anterior) no se recarga: así no se borra lo que se está escribiendo
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (!hadController) { hadController = true; return; } if (!reloaded) { reloaded = true; location.reload(); } });
  }
