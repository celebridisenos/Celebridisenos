<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="CelebriDiseños · Gestión de pedidos, clientes, productos, tareas y redes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CelebriDiseños">
<title>CelebriDiseños</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<!--HOST-->
<script>
  try { var t = localStorage.getItem('cd.theme') || 'claro'; if (t === 'sistema') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro'; document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<script src="js/logic.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="app"><div class="center-page"><div class="col" style="align-items:center"><img src="icons/icon-192.png" width="72" height="72" alt=""><p class="muted">Cargando CelebriDiseños…</p></div></div></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script>
  // Si el navegador es demasiado antiguo para la app, lo decimos claramente
  setTimeout(function () { if (!window.__appStarted && !document.querySelector('.shell,.auth-card,.wizard')) { var d = document.getElementById('app'); if (d && /Cargando/.test(d.textContent)) d.innerHTML = '<div class="center-page"><div class="card auth-card"><h2>No se pudo iniciar</h2><p>Actualiza el navegador (Chrome, Edge o Safari recientes) o recarga la página.</p><button class="btn primary" onclick="location.reload()">Recargar</button></div></div>'; } }, 15000);
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        w && w.addEventListener('statechange', function () {
          if (w.state === 'installed' && navigator.serviceWorker.controller) {
            var b = document.createElement('div');
            b.className = 'toast'; b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:90px;z-index:400';
            b.innerHTML = '<span>Hay una versión nueva de la app.</span> <button class="btn sm primary">Actualizar</button>';
            b.querySelector('button').onclick = function () { w.postMessage('skip'); };
            document.body.appendChild(b);
          }
        });
      });
    });
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (!reloaded) { reloaded = true; location.reload(); } });
  }
</script>
</body>
</html>
